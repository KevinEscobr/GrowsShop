services:
  # 1. El motor PHP-FPM con extensiones de Laravel
  tiendagrow-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tiendagrow-backend-php
    environment:
      DB_HOST: tiendagrow-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tiendagrow_db}
      DB_USERNAME: ${DB_USERNAME:-tiendagrow_user}
      DB_PASSWORD: ${DB_PASSWORD:-cambia_esta_clave_segura}
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - tiendagrow-db
    networks:
      - proxy-public-network

  # 2. El servidor Nginx para los archivos estáticos y enrutamiento
  tiendagrow-nginx:
    image: 'nginx:alpine'
    container_name: tiendagrow-backend-nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - tiendagrow-php
    networks:
      - proxy-public-network

  # 3. Base de datos MySQL 8.0 dedicada para TiendaGrow
  tiendagrow-db:
    image: 'mysql:8.0'
    container_name: tiendagrow-backend-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tiendagrow_db}
      MYSQL_USER: ${DB_USERNAME:-tiendagrow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cambia_esta_clave_segura}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cambia_esta_clave_root_segura}
    volumes:
      - tiendagrow-mysql-data:/var/lib/mysql
    networks:
      - proxy-public-network

networks:
  proxy-public-network:
    external: true

volumes:
  tiendagrow-mysql-data:
