server {
    listen 80;
    server_name tiendagrow.nennge.me growshop.nennge.me tienda.nennge.me localhost;
    client_max_body_size 20M;
    server_tokens off;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    
    root /var/www/html/public;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;

    # Cabeceras de Seguridad (OWASP Best Practices)
    add_header 'X-Content-Type-Options' 'nosniff' always;
    add_header 'X-Frame-Options' 'SAMEORIGIN' always;
    add_header 'X-XSS-Protection' '1; mode=block' always;
    add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
    add_header 'Permissions-Policy' 'camera=(), microphone=(), geolocation=()' always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Mitigación RCE: Denegar la ejecución de scripts PHP en directorios de almacenamiento o uploads
    location ~* /(?:uploads|storage)/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass tiendagrow-backend-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # Denegar acceso a archivos y carpetas ocultas (.env, .git, etc.) excepto .well-known
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a bases de datos, backups, logs, archivos de volcado o configuración
    location ~* \.(sqlite|sqlite3|db|sql|env|log|bak|yml|yaml|ini|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}